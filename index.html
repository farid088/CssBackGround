<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap"

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>WeddingDay</title>
</head>

<body>
    <div class="invitation">
        <h1>The</h1>
        <h2>Wedding</h2>
        <h3>Of</h3>

        <div class="names">
            LAUREN HALL & JORDON QUINN
        </div>

        <p class="date">
            FRIDAY 24TH APRIL 2019

        <p class="location">
            <i class="fa-solid fa-location-dot"></i>
            WINCHESTER HOUSE
        </p>

        <p class="reception">Reception to follow</p>
    </div>
